// sensfinder.cfg - LOCAL practice server only. Never use this with matchmaking or any
// VAC-secured server.
//
// Verification status is marked per line:
//   [ok]      long-standing CS:GO/CS2 ConVar, expected to exist
//   [check]   unverified on this build - run it in the server console and confirm it is not
//             "Unknown command"; delete or replace it if it is, and record that in NOTES.md
//
// sv_cheats is 0 (2026-10-08): with it on, any player can type noclip/give/god. bot_stop,
// bot_dont_shoot and sv_infinite_ammo are cheat-FLAGGED, so the plugin clears that flag on those three
// (EnforceNoCheats, every 5 s) and sets them; sv_cheats goes off regardless, because the plugin also
// freezes and disarms the bots itself (PinBots) and refills ammo itself (RefillAmmo).
// If the plugin is not loaded, these three lines are refused and the bots walk and shoot back.

hostname "SensFinder arena"          // [ok]
// sv_lan 0 lets clients outside this subnet join (opened up 2026-09-27). One consequence: RCON
// shares port 27015 over TCP, so a router forward must be UDP-only or the console password travels
// with it. Since plugin v0.5.0 several players run blocks AT THE SAME TIME, each in their own sealed
// arena cell (lane) with their own bots, HUD and data; when every lane is held a new run is refused
// with a chat message instead of queueing (HOSTING.md 1, 6).
sv_lan 0                             // [ok]
sv_cheats 0                          // [check] plugin unlocks the 3 bot convars instead - see note above
// sv_pure is an Unknown command on this build (probed 2026-10-01): the old candidate line was
// deleted. The -insecure question is settled by the Steam Workshop route (HOSTING.md 4, route 1).

// RCON password: it is NOT stored in this file or anywhere else in the repo. The machine that
// starts the server must export SENSFINDER_RCON (tools\start-server.ps1 reads it and passes it on
// the command line as +rcon_password; tools\rcon.ps1 / rcon.py / deploy-plugin.ps1 read the same
// variable). -usercon is still required on the command line: without it the RCON TCP port stays
// closed even with a password set. If the variable is missing, start-server.ps1 refuses to start
// rather than silently leaving RCON closed.
// Safe from client download: this build has no download convars at all (see the block below).

// MAP DISTRIBUTION: this build has NO download convars left. sv_downloadurl, sv_allowupload,
// sv_allowdownload and sv_downloadfilter are all "Unknown command" (probed 2026-09-27 on
// 1.41.8.5/14185), so neither FastDL nor direct-from-server transfer can be switched on here.
// Joiners get the map from the Steam Workshop (publish sensfinder_arena.vpk from the owning Steam
// account) or by copying game/csgo/maps/sensfinder_arena.vpk (12.4 MB) into their own client.
// Do not add downloadurl lines: they would silently do nothing.

// An empty server hibernates and stops simulating ticks, which stops CounterStrikeSharp
// timers firing. The plugin re-execs this cfg on a 3s timer after map load (to land after
// server_default.cfg / gamemode_competitive.cfg overwrite our ConVars), so hibernation would
// silently prevent that re-exec from ever happening.
sv_hibernate_when_empty 0            // [ok]

// Endless round, nobody wins, no warmup
mp_warmup_end                        // [ok]
mp_ignore_round_win_conditions 1     // [ok]
mp_freezetime 0                      // [ok]
mp_roundtime 60                      // [ok]
mp_round_restart_delay 1             // [ok]
mp_maxrounds 0                       // [ok]
mp_autoteambalance 0                 // [ok]
mp_limitteams 0                      // [ok]
// Mid-round joiners: with the default 0 the engine parks anyone who joins after the round started as
// a spectator (camera at the world origin = inside the lanes map's centre wall) until the NEXT round,
// which this endless-round server never has (2026-10-08). The grace window is measured from round
// start, so a huge value keeps "just started" true for the whole run: every joiner spawns at once.
// Per player, no round restart. Only takes effect through the engine's jointeam path (the plugin's
// EngineJoinCt), not through a bare ChangeTeam().
mp_join_grace_time 99999             // [check] 2026-10-08, not yet verified with a 2nd human

// Humans on CT, bots on T: TWO bots per lane (the rush task seats both; every other task uses one
// and the plugin parks the spare out of view in the parking cell). bot_quota = 2 x Lanes = 16 for
// the 8-lane map. Never lower it below 2 x Lanes: the quota manager KICKS any bot the plugin adds
// with bot_add_t beyond the quota, so with too few bots a session's rush trial finds no free bot,
// waits ~3 s and is logged unscored with a chat warning naming this quota (it was 2 before lanes).
// PLAYER CAP (measured 2026-10-07, 0 humans, bot_quota 40): the server only holds as many players as
// its GAME MODE allows - competitive (+game_mode 1, what start-server.ps1 runs by default) 10 in
// total, casual 20, deathmatch >= 17, custom (+game_type 3 +game_mode 0) >= 32 - whatever bot_quota
// says. 8 lanes need 8 humans + 16 bots = 24, so the default competitive mode serves about 3 lanes
// (3 humans + 6 bots + a spare) and the quota above is silently not met. Pick the mode with
// tools\start-server.ps1 -GameType/-GameMode and re-run the acceptance matrix in it (NOTES.md): the
// rest of this cfg has only ever been run in competitive. The slot cap itself (-maxplayers, default
// 64) is not the limit.
mp_humanteam CT                      // [check]
// 10, not 2 x Lanes = 16: measured 2026-10-07 in competitive mode the T team (where bot_join_team puts
// them) holds at most 10, and bots beyond that spill onto CT - the human's own team - where they take no
// damage from the human, so trials on them can never register a hit (the plugin now only targets T bots).
// 10 bots = 5 sessions with rush (2 bots each) or 10 without. Modes with a bigger cap (see below) can
// raise this to 2 x Lanes.
bot_quota 10                         // [ok]
bot_quota_mode normal                // [ok]
// Default (1) makes the quota manager kick every bot while no human is connected and refill only at a
// round reset, which this endless-round server never has; the old workaround (mp_restartgame) put
// competitive mode back into warmup. 0 keeps the bots through an empty server. (2026-10-07)
bot_join_after_player 0              // [ok]
bot_join_team T                      // [check]
bot_difficulty 0                     // [ok]

// Nobody on this practice server may be kicked or "punished": mp_autokick (default ON in competitive)
// kicks idle players - 2026-10-07 it kicked the only human (NETWORK_DISCONNECT_KICKED_IDLE) - and
// team-damagers (mp_td_dmgtokick 300). Friendly fire off: a stray hit on a bot or player on the human's
// team must neither hurt nor count as team damage.
mp_autokick 0                        // [ok]
mp_friendlyfire 0                    // [ok]

// Bots must stand still and never shoot back
bot_stop 1                           // [check] cheat flag cleared by the plugin
bot_dont_shoot 1                     // [check] cheat flag cleared by the plugin
bot_chatter off                      // [ok]

// Player: fixed loadout, no ammo or money issues
mp_buytime 0                         // [ok]
mp_startmoney 0                      // [ok]
mp_free_armor 0                      // [ok]
mp_respawn_on_death_ct 1             // [ok]
mp_respawn_on_death_t 1              // [ok]
// No spawn protection: the plugin respawns a dead bot when a trial needs it, and a protected bot cannot be
// hit - deathmatch-type game modes protect respawns for 10 s, i.e. the first 3-4 trials would not register
// (player report 2026-10-09). -1 = off, warm-up included (Valve's competitive value). Also set by the plugin.
mp_respawn_immunitytime -1           // [ok]
sv_infinite_ammo 1                   // [check] flag cleared by the plugin; RefillAmmo also tops ammo up
// No random bullet spread: a well-aimed shot always lands where the crosshair is, so a miss is the aim.
// Cheat-flagged: refused here while sv_cheats is 0; the plugin clears the flag and sets it within 5 s
// (EnforceNoCheats) and logs "Cvars: ... all hold" or "did NOT take".
weapon_accuracy_nospread 1           // [check] 2026-10-09, not yet verified on the hosted server
mp_t_default_secondary ""            // [ok]
mp_ct_default_secondary ""           // [ok]
mp_ct_default_primary "weapon_ak47"  // [ok]
mp_t_default_primary ""              // [ok]
ammo_grenade_limit_total 0           // [ok]

// Keep the practice session quiet and stable
sv_alltalk 1                         // [ok]
mp_death_drop_gun 0                  // [ok]
mp_playercashawards 0                // [ok]
mp_teamcashawards 0                  // [ok]
